# linuxfs-plugins – pluginy pro souborové manažery (Total Commander, Altap/Open Salamander) pro souborové systémy Linuxu: btrfs (podsvazky, komprese zlib/LZO/zstd) a ext2/3/4 a SquashFS, jen čtení.
[workspace]
resolver = "3"
members = ["crates/linuxfs-core", "crates/linuxfs-wcx", "crates/linuxfs-spl"]
exclude = ["vendor/btrfs-disk", "vendor/ext4-view"] # upstream crates s lokálními patchi (viz PATCHES.md v adresářích), nejsou členy workspace

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
btrfs-disk = { path = "vendor/btrfs-disk", version = "=0.13.0" } # parser on-disk struktur btrfs (MIT OR Apache-2.0), bez bindgenu, viz vendor/btrfs-disk/PATCHES.md
# dekomprese extentů btrfs: zlib (flate2, čistý Rust), zstd (ruzstd, čistý Rust); LZO je v linuxfs-core/src/lzo.rs
flate2 = "1"
ruzstd = "0.9"
ext4-view = { path = "vendor/ext4-view", version = "=1.0.0", default-features = false } # ext2/3/4 jen pro čtení (MIT OR Apache-2.0, no_std, bez unsafe), s lokální opravou, viz vendor/ext4-view/PATCHES.md
rust-fs-squashfs = { version = "=0.4.0", default-features = false } # SquashFS 4.0 jen pro čtení (MIT, čistý Rust; gzip / xz / lzo / lz4 / zstd)
rust-fs-core = "0.3" # BlockRead a Error, které rust-fs-squashfs používá (lib se jmenuje fs_core); verze musí odpovídat té, kterou si bere rust-fs-squashfs
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Time",
] }
linuxfs-core = { path = "crates/linuxfs-core" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind" # MUSÍ zůstat "unwind": exportované funkce pluginů používají catch_unwind, aby chyba nikdy nesrazila hostitelskou aplikaci (panic unikající skrz extern "system" by proces ukončil).
